<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>단간론파 역극</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 로비 -->
  <section id="lobby" class="hidden">
    <div class="lobby-box">
      <h1 class="logo">DANGAN<span>RP</span></h1>
      <p class="sub">희망과 절망의 역극 — 일상 · 조사 · 학급재판</p>
      <div class="lobby-tabs">
        <button data-mode="join" class="active">방 참가 / 로그인</button>
        <button data-mode="create">새 방 만들기 (GM)</button>
      </div>
      <form id="lobbyForm" class="card stack">
        <label class="mode-join">방 코드<input id="lCode" maxlength="10" autocomplete="off" placeholder="5자리 코드" /></label>
        <label class="mode-create hidden">방 제목<input id="lTitle" maxlength="60" placeholder="예: 희망봉 학원" /></label>
        <label>닉네임 (계정 이름)<input id="lNick" maxlength="20" autocomplete="username" required /></label>
        <label>비밀번호<input id="lPass" type="password" maxlength="100" autocomplete="current-password" required /></label>
        <p class="hint">처음이면 입력한 닉네임/비밀번호로 계정이 만들어집니다. 다른 기기에서도 같은 닉네임·비밀번호로 들어오면 내 캐릭터를 그대로 쓸 수 있어요.</p>
        <button class="btn pink" id="lSubmit">입장</button>
        <p id="lError" class="error"></p>
      </form>
    </div>
  </section>

  <!-- 앱 -->
  <section id="app" class="hidden">
    <header class="topbar">
      <a class="brand" href="#/board/all"><b id="tTitle"></b><small>코드 <span id="tCode" title="초대 링크 복사"></span></small></a>
      <div class="phase-info"><span id="tDay" class="day"></span><span id="tPhase" class="phase-badge"></span></div>
      <nav class="mainnav">
        <a href="#/board/all" data-nav="board">📋 게시판</a>
        <a href="#/trial" data-nav="trial">⚖️ 학급재판</a>
        <a href="#/handbook/roster" data-nav="handbook">📱 학생수첩</a>
        <a href="#/shop" data-nav="shop">🏪 매점</a>
        <a href="#/gm" data-nav="gm" class="gm-only">👑 GM</a>
      </nav>
      <div class="usermenu"><span id="tUser"></span><button id="logoutBtn" class="btn tiny ghost">로그아웃</button></div>
    </header>
    <main id="view"></main>
  </section>

  <div id="splash" class="splash hidden"></div>
  <div id="toasts"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
